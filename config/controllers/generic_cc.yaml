# Fallback profile for standard MIDI controllers without proprietary DAW handshakes.

name: "Generic MIDI Controller"
driver: "bridge.drivers.base:BaseControllerDriver"

encoder_bank_cc: null
encoder_banks: {}

pads:
  base_note_top: 0
  base_note_bottom: 0
  channel: 1

encoders:
  channel: 1
  ccs: [1, 2, 3, 4, 5, 6, 7, 8]

transport:
  channel: 1
  play: null
  stop: null
  record: null

led:
  static_channel: 1
  pulse_channel: 1
  colors: {}
