# Novation Launchkey Mini MK4 DAW-mode layout.

name: "Novation Launchkey Mini MK4"
driver: "bridge.drivers.novation_lk:LaunchkeyMK3Driver"

# DAW handshake bytes (channel 16 note 12)
handshake:
  connect: [0x9F, 0x0C, 0x7F]
  disconnect: [0x9F, 0x0C, 0x00]

# Encoder mode switching is reported on channel 7 CC 30
encoder_bank_cc: 30
encoder_bank_channel: 7
encoder_banks:
  1: mixer
  2: device
  4: sends
  5: transport

# Pad grid (16 pads in two rows of 8)
# MK4 DAW mode pads send Note On/Off on Channel 1
pads:
  base_note_top: 0x60
  base_note_bottom: 0x70
  channel: 1

# CCs for the 8 encoders in Device/Plugin mode (channel 16)
encoders:
  channel: 16
  ccs: [21, 22, 23, 24, 25, 26, 27, 28]

# Transport buttons are reported as CCs on channel 1 (DAW port raw bytes B0 ...)
transport:
  channel: 1
  play: 115   # 0x73
  stop: 118   # 0x76 — no dedicated Stop button on Mini MK4; Play toggles start/stop
  record: 117 # 0x75

# LED feedback channels and colours
led:
  static_channel: 1
  pulse_channel: 3
  colors:
    "off": 0
    dim_red: 1
    bright_red: 3
    dim_orange: 17
    bright_orange: 19
    amber: 35
    dim_yellow: 45
    bright_yellow: 47
    dim_green: 16
    bright_green: 18
    dim_cyan: 32
    bright_cyan: 34
    dim_blue: 48
    bright_blue: 50
    dim_purple: 64
    bright_purple: 66
    white: 127
