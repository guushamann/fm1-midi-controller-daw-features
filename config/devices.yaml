# Active USB port regexes and selected driver / synth profiles.
# Patterns are matched against ALSA port names returned by mido.

controller:
  profile: launchkey_mk3
  port_patterns:
    midi_in: "Launchkey Mini MK3:Launchkey Mini MK3 MIDI .+"
    midi_out: "Launchkey Mini MK3:Launchkey Mini MK3 MIDI .+"
    daw_in: "Launchkey Mini MK3:Launchkey Mini MK3 DAW .+"
    daw_out: "Launchkey Mini MK3:Launchkey Mini MK3 DAW .+"

synth:
  profile: fm1_melodee
  port_patterns:
    midi_in: "FM-1:FM-1 MIDI .+|M-VAVE FM-1:FM-1 MIDI .+|Melodee:Melodee MIDI .+"
    midi_out: "FM-1:FM-1 MIDI .+|M-VAVE FM-1:FM-1 MIDI .+|Melodee:Melodee MIDI .+"
