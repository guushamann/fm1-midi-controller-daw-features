# Active USB port regexes and selected driver / synth profiles.
# Patterns are matched against ALSA port names returned by mido.

controller:
  profile: launchkey_mk4
  port_patterns:
    midi_in: "Launchkey Mini.*MIDI .+"
    midi_out: "Launchkey Mini.*MIDI .+"
    daw_in: "Launchkey Mini.*DAW .+"
    daw_out: "Launchkey Mini.*DAW .+"

synth:
  profile: fm1_melodee
  port_patterns:
    midi_in: "FM-1:FM-1 MIDI .+|M-VAVE FM-1.*MIDI .+|Melodee FM-1.*MIDI .+|Melodee:Melodee MIDI .+"
    midi_out: "FM-1:FM-1 MIDI .+|M-VAVE FM-1.*MIDI .+|Melodee FM-1.*MIDI .+|Melodee:Melodee MIDI .+"
