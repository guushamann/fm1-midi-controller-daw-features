<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FM-1 MIDI Bridge</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:1rem 1.5rem; border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; }
    h1 { margin:0; font-size:1.25rem; }
    .container { padding:1.5rem; max-width:1200px; margin:0 auto; }
    .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
    .card { background:var(--panel); border-radius:0.5rem; padding:1rem; }
    .card h2 { margin:0 0 0.75rem; font-size:1rem; color:var(--accent); }
    .row { display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid #334155; }
    .row:last-child { border-bottom:none; }
    .badge { padding:0.2rem 0.5rem; border-radius:999px; font-size:0.75rem; font-weight:600; }
    .badge.connected { background:#14532d; color:var(--ok); }
    .badge.disconnected { background:#450a0a; color:var(--err); }
    .muted { color:var(--muted); font-size:0.875rem; }
    .btn { background:#334155; color:var(--text); border:none; padding:0.5rem 0.75rem; border-radius:0.375rem; cursor:pointer; font-size:0.875rem; }
    .btn:hover { background:#475569; }
    .btn.accent { background:#0284c7; }
    .btn-row { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.75rem; }
    .log { background:#020617; border:1px solid #334155; border-radius:0.375rem; height:280px; overflow-y:auto; padding:0.5rem; font-family:monospace; font-size:0.8rem; }
    .log-entry { margin:0.15rem 0; }
    .log-in { color:#a5f3fc; }
    .log-out { color:#86efac; }
    .controls { display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap; }
    select, textarea { background:#0f172a; color:var(--text); border:1px solid #334155; border-radius:0.375rem; padding:0.4rem; }
    textarea { width:100%; min-height:220px; font-family:monospace; font-size:0.8rem; }
    .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:0.5rem; }
    .status-dot.on { background:var(--ok); }
    .status-dot.off { background:var(--err); }
  </style>
</head>
<body>
  <header>
    <h1>FM-1 MIDI Bridge</h1>
    <span id="conn" class="muted"><span class="status-dot off" id="conn-dot"></span>WebSocket</span>
  </header>
  <div class="container">
    <div class="grid">
      <div class="card">
        <h2>Device Matrix</h2>
        <div id="matrix"></div>
        <div class="btn-row">
          <button class="btn accent" onclick="resendHandshake()">Re-Send DAW Handshake</button>
          <button class="btn" onclick="midiPanic()">MIDI Panic</button>
          <button class="btn" onclick="ledTest()">LED Diagnostic</button>
        </div>
      </div>
      <div class="card">
        <h2>Profiles</h2>
        <div class="row"><span>Controller</span><select id="ctrl-profile"></select></div>
        <div class="row"><span>Synth</span><select id="synth-profile"></select></div>
        <div class="btn-row"><button class="btn" onclick="saveProfiles()">Save Profiles</button></div>
      </div>
      <div class="card">
        <h2>Live MIDI Monitor</h2>
        <div class="controls">
          <label><input type="checkbox" id="filter-clock" checked> Hide Clock</label>
          <label><input type="checkbox" id="filter-active" checked> Hide Active Sense</label>
          <button class="btn" onclick="pauseLog()">Pause</button>
          <button class="btn" onclick="clearLog()">Clear</button>
        </div>
        <div id="log" class="log"></div>
      </div>
      <div class="card">
        <h2>Mapping Editor</h2>
        <select id="map-profile"></select>
        <textarea id="map-editor"></textarea>
        <div class="btn-row">
          <button class="btn accent" onclick="saveMapping()">Save & Reload</button>
          <button class="btn" onclick="loadMapping()">Reload</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const wsUrl = `ws://${location.host}/ws/monitor`;
    let ws;
    let logPaused = false;
    let reconnectTimer;

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        document.getElementById('conn-dot').className = 'status-dot on';
        fetchStatus();
        fetchProfiles();
        loadMapping();
      };
      ws.onclose = () => {
        document.getElementById('conn-dot').className = 'status-dot off';
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 2000);
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'status') renderStatus(msg.data);
        if (msg.type === 'midi') appendLog(msg.data);
      };
    }

    async function fetchStatus() {
      const res = await fetch('/api/status');
      const json = await res.json();
      renderStatus(json.ports);
      populateProfiles(json.profiles, json.active);
    }

    async function fetchProfiles() {
      const res = await fetch('/api/status');
      const json = await res.json();
      populateProfiles(json.profiles, json.active);
    }

    function renderStatus(status) {
      const matrix = document.getElementById('matrix');
      const ctrl = status.controller || {};
      const synth = status.synth || {};
      const rows = [
        ['Launchkey DAW IN', ctrl.daw_in], ['Launchkey DAW OUT', ctrl.daw_out],
        ['Launchkey MIDI IN', ctrl.midi_in], ['Launchkey MIDI OUT', ctrl.midi_out],
        ['FM-1 MIDI IN', synth.midi_in], ['FM-1 MIDI OUT', synth.midi_out],
      ];
      matrix.innerHTML = rows.map(([label, name]) => {
        const connected = !!name;
        return `<div class="row"><span>${label}</span><span class="badge ${connected?'connected':'disconnected'}">${connected?'Connected':'Disconnected'}</span></div>`;
      }).join('');
    }

    function populateProfiles(profiles, active) {
      const fill = (sel, list, val) => {
        const s = document.getElementById(sel);
        s.innerHTML = list.map(p => `<option value="${p}" ${p===val?'selected':''}>${p}</option>`).join('');
      };
      fill('ctrl-profile', profiles.controllers, active.controller.profile);
      fill('synth-profile', profiles.synths, active.synth.profile);
      const mapSel = document.getElementById('map-profile');
      mapSel.innerHTML = profiles.synths.map(p => `<option value="${p}" ${p===active.synth.profile?'selected':''}>${p}</option>`).join('');
    }

    function appendLog(data) {
      if (logPaused) return;
      const bytes = data.bytes || [];
      if (document.getElementById('filter-clock').checked && bytes.length === 1 && bytes[0] === 0xF8) return;
      if (document.getElementById('filter-active').checked && bytes.length === 1 && bytes[0] === 0xFE) return;
      const dir = data.direction === 'IN' ? 'IN  - ' + data.port : 'OUT - ' + data.port;
      const cls = data.direction === 'IN' ? 'log-in' : 'log-out';
      const line = `<div class="log-entry ${cls}">[${dir}] ${bytes.map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ')}</div>`;
      const log = document.getElementById('log');
      log.insertAdjacentHTML('beforeend', line);
      if (log.children.length > 500) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }

    function pauseLog() { logPaused = !logPaused; event.target.textContent = logPaused ? 'Resume' : 'Pause'; }
    function clearLog() { document.getElementById('log').innerHTML = ''; }

    async function resendHandshake() { await fetch('/api/actions/handshake', {method:'POST'}); }
    async function midiPanic() { await fetch('/api/actions/panic', {method:'POST'}); }
    async function ledTest() { await fetch('/api/actions/led-test', {method:'POST'}); }

    async function saveProfiles() {
      const controller = { profile: document.getElementById('ctrl-profile').value, port_patterns: {} };
      const synth = { profile: document.getElementById('synth-profile').value, port_patterns: {} };
      await fetch('/api/ports', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({controller, synth})});
    }

    async function loadMapping() {
      const profile = document.getElementById('map-profile').value;
      const res = await fetch('/api/mappings?profile=' + profile);
      const json = await res.json();
      document.getElementById('map-editor').value = JSON.stringify(json.data, null, 2);
    }

    async function saveMapping() {
      const profile = document.getElementById('map-profile').value;
      const data = JSON.parse(document.getElementById('map-editor').value);
      await fetch('/api/mappings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({profile, data})});
    }

    connect();
  </script>
</body>
</html>
